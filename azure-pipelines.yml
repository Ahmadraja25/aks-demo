# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: 'aks-demo'
  acrLoginServer: 'aksdemoregistry321.azurecr.io'

steps:

- checkout: self

- task: Docker@2
  displayName: Build and Push Docker Image
  inputs:
    containerRegistry: 'acr-svc'
    repository: '$(imageName)'
    command: 'buildAndPush'
    Dockerfile: 'Dockerfile'
    tags: |
      $(Build.BuildId)

- task: KubernetesManifest@1
  displayName: Deploy Application to AKS
  inputs:
    action: 'deploy'
    kubernetesServiceConnection: 'aks-svc'
    manifests: |
      deployment.yaml
    containers: |
      $(acrLoginServer)/$(imageName):$(Build.BuildId)
