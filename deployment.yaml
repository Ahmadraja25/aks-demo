apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-demo
  template:
    metadata:
      labels:
        app: aks-demo
    spec:
      containers:
        - name: aks-demo
          image: aksdemoregistry321.azurecr.io/aks-demo:PLACEHOLDER
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: aks-demo-service
spec:
  type: LoadBalancer
  selector:
    app: aks-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
